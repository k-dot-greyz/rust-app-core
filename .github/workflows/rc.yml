name: release check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rc:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # @stable moves. @master with an empty toolchain input exits 1.
      # scripts/rc-check.sh refuses a compiler older than 1.99.1.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt,clippy
          targets: wasm32-unknown-unknown
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: ">=22.12.0"
          cache: pnpm
          cache-dependency-path: shorthand/pnpm-lock.yaml
      - name: install the shorthand
        working-directory: shorthand
        run: pnpm install --frozen-lockfile
      - name: hull and shorthand
        run: ./scripts/rc-check.sh
