name: release check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: shorthand/pnpm-lock.yaml
      - name: install the shorthand
        working-directory: shorthand
        run: pnpm install --frozen-lockfile
      - name: hull and shorthand
        run: ./scripts/rc-check.sh
